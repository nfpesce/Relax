<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101820">
    <title>Respirar</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <section class="timer-panel">
        <div class="phase-copy">
          <p class="eyebrow">Ritmo de respiracion</p>
          <h1 id="phaseTitle">Listo</h1>
          <p id="phaseHint">Configura los segundos y presiona iniciar.</p>
        </div>

        <div class="breath-visual" id="breathVisual" data-phase="idle">
          <div class="pie" id="pie" aria-hidden="true"></div>
          <div class="timer-readout">
            <span id="secondsLeft">0.0</span>
            <small>seg</small>
          </div>
        </div>

        <div class="progress-meta">
          <span id="cycleLabel">Ciclo 0</span>
          <span id="nextLabel">Inhala 3s / Exhala 6s</span>
        </div>
      </section>

      <section class="controls-panel" aria-label="Controles de respiracion">
        <div class="duration-grid">
          <label class="duration-control">
            <span>Inhalar</span>
            <div class="stepper">
              <button type="button" data-step="inhale" data-delta="-0.5" aria-label="Reducir inhalacion">-</button>
              <input id="inhaleSeconds" type="number" inputmode="decimal" min="1" max="20" step="0.5" value="3">
              <button type="button" data-step="inhale" data-delta="0.5" aria-label="Aumentar inhalacion">+</button>
            </div>
          </label>

          <label class="duration-control">
            <span>Exhalar</span>
            <div class="stepper">
              <button type="button" data-step="exhale" data-delta="-0.5" aria-label="Reducir exhalacion">-</button>
              <input id="exhaleSeconds" type="number" inputmode="decimal" min="1" max="30" step="0.5" value="6">
              <button type="button" data-step="exhale" data-delta="0.5" aria-label="Aumentar exhalacion">+</button>
            </div>
          </label>
        </div>

        <div class="action-row">
          <button class="primary-action" id="toggleButton" type="button">Iniciar</button>
          <button class="secondary-action" id="resetButton" type="button">Reiniciar</button>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
